<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e18">
<title>공명 전쟁</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 시작 화면 -->
  <section id="menu" class="scr">
    <div class="logo"><h1>공명 전쟁</h1><div class="sub">아르카를 둘러싼 여덟 종족</div></div>
    <div class="menu">
      <button class="big go" data-go="map">▶ START</button>
      <button data-go="story">📖 STORY · 세계관</button>
      <button data-go="race">🧬 RACE · 종족</button>
      <button data-go="upgrade">⭐ UPGRADE · 영구 성장</button>
      <button data-go="settings">⚙️ SETTINGS · 설정</button>
    </div>
    <details class="card small"><summary>📜 업데이트 내역</summary><ul id="updates">
      <li><b>v0.2</b> 대개편 MVP: 육각 타일 기지 운영 + 자동 전투 디펜스. 철성 연합 · 혼성 「반석 기사단」 · 일꾼/루멘/정수 · 건물 3 · 유닛 6 · 적 5 + 보스 · 웨이브 10 · 스테이지 3 · 기술 8 · 시너지 · 영구 성장 · 저장. 8종족·28혼성 설정 데이터(대부분 준비 중).</li>
      <li><b>v0.1</b> 8인 원형 대전 시제품(<a href="legacy/ring-war/">보관판으로 이동</a>)</li>
    </ul></details>
  </section>

  <!-- 스테이지 선택(세계 지도) -->
  <section id="map" class="scr hide">
    <div class="hd"><button data-go="menu">←</button><h2>세계 지도</h2></div>
    <div id="regions"></div>
    <div class="card">
      <div class="lbl">난이도</div><div id="diffs" class="seg"></div>
      <div class="lbl" style="margin-top:10px">종족 · 혼성 종족</div><div id="loadout"></div>
    </div>
    <div id="stageInfo" class="card small"></div>
    <button id="bGo" class="big go">⚔️ 출전</button>
  </section>

  <section id="story" class="scr hide"><div class="hd"><button data-go="menu">←</button><h2>세계관</h2></div><div id="storyBody"></div></section>
  <section id="race" class="scr hide"><div class="hd"><button data-go="menu">←</button><h2>종족</h2></div><div id="raceBody"></div></section>
  <section id="upgrade" class="scr hide"><div class="hd"><button data-go="menu">←</button><h2>영구 성장</h2></div><div id="upBody"></div></section>
  <section id="settings" class="scr hide"><div class="hd"><button data-go="menu">←</button><h2>설정</h2></div><div id="setBody"></div></section>

  <!-- 전투 -->
  <section id="battle" class="scr hide">
    <div class="top">
      <span class="res"><b id="tA">0</b><b id="tB">0</b></span>
      <span class="nx"><i id="tHp"></i><i id="tSh"></i><em id="tHpT"></em></span>
      <span id="tWave" class="wv"></span>
    </div>
    <div id="tStage" class="stname"></div>
    <div id="cwrap">
      <canvas id="cv"></canvas>
      <div id="waveBox"></div>
      <div id="synBox"></div>
      <div id="toast"></div>
      <div class="camBtns"><button id="zIn">＋</button><button id="zOut">－</button><button id="zFit">⤢</button></div>
    </div>
    <div id="bench"></div>
    <div id="info"></div>
    <div id="tabs">
      <button data-tab="bld">🏗<span>건물</span></button><button data-tab="unit">⚔️<span>유닛</span></button><button data-tab="tech">🔬<span>기술</span></button><button data-tab="nexus">💠<span>넥서스</span></button><button data-tab="wk">⛏<span>일꾼</span></button>
    </div>
    <div id="panel"></div>
    <div class="ctl"><button id="bPause">⏸</button><button id="bSpd">1x</button><button id="bQuit">메뉴</button></div>
  </section>

  <div id="modal" class="modal hide"><div class="mbox" id="mBody"></div></div>
</div>
<script src="js/core/util.js"></script>
<script src="js/core/save.js"></script>
<script src="js/grid/hex.js"></script>
<script src="js/data/core.js"></script>
<script src="js/data/races.js"></script>
<script src="js/data/units.js"></script>
<script src="js/data/buildings.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/data/tech.js"></script>
<script src="js/data/stages.js"></script>
<script src="js/game/state.js"></script>
<script src="js/game/economy.js"></script>
<script src="js/game/build.js"></script>
<script src="js/game/combat.js"></script>
<script src="js/render/render.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/ui/battle_ui.js"></script>
</body>
</html>
